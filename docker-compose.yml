services:
  postgres:
    image: postgres:17-alpine
    container_name: modernality-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: modernality
      POSTGRES_PASSWORD: modernality
      POSTGRES_DB: modernality
    ports:
      - "5432:5432"
    volumes:
      - modernality_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modernality -d modernality"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  modernality_pgdata:
